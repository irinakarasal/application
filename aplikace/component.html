<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Jednoduchý Carousel</title>
<style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: sans-serif;
    }
    .carousel {
      max-width: 100%;
      height: 300px; /* o ~40 % menší než běžný hero */
      overflow: hidden;
      position: relative;
    }
    .slides {
      display: flex;
      width: 300%;
      height: 100%;
      animation: slide 12s infinite;
    }
    .slides img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @keyframes slide {
      0%   {margin-left: 0;}
      33%  {margin-left: -100%;}
      66%  {margin-left: -200%;}
      100% {margin-left: 0;}
    }
</style>
</head>
<body>
<div class="carousel">
<div class="slides">
<img src="https://placekitten.com/1024/600" alt="Obrázek 1">
<img src="https://placekitten.com/1025/600" alt="Obrázek 2">
<img src="https://placekitten.com/1026/600" alt="Obrázek 3">
</div>
</div>
</body>
</html>
