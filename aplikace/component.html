<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moderní Carousel</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      height: 100vh;
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .carousel-image {
      width: 30%;
      border-radius: 12px;
      object-fit: cover;
      filter: brightness(0.9);
      transition: transform 0.3s;
    }

    .carousel-image:hover {
      transform: scale(1.03);
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.7);
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 50%;
      z-index: 1;
    }

    .nav-btn.left {
      left: 10px;
    }

    .nav-btn.right {
      right: 10px;
    }

    .dots {
      text-align: center;
      margin-top: 12px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
    }

    .dot.active {
      background-color: #333;
    }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-track" id="track">
      <div class="carousel-slide">
        <img src="https://picsum.photos/id/1005/300/200" class="carousel-image" />
        <img src="https://picsum.photos/id/1025/300/200" class="carousel-image" />
        <img src="https://picsum.photos/id/1015/300/200" class="carousel-image" />
      </div>
      <div class="carousel-slide">
        <img src="https://picsum.photos/id/1011/300/200" class="carousel-image" />
        <img src="https://picsum.photos/id/1022/300/200" class="carousel-image" />
        <img src="https://picsum.photos/id/1033/300/200" class="carousel-image" />
      </div>
    </div>
    <button class="nav-btn left" onclick="prevSlide()">&#10094;</button>
    <button class="nav-btn right" onclick="nextSlide()">&#10095;</button>
    <div class="dots">
      <span class="dot active" onclick="goToSlide(0)"></span>
      <span class="dot" onclick="goToSlide(1)"></span>
    </div>
  </div>

  <script>
    const track = document.getElementById("track");
    const dots = document.querySelectorAll(".dot");
    let currentSlide = 0;

    function updateSlide(index) {
      const slideWidth = track.clientWidth;
      track.style.transform = `translateX(-${index * slideWidth}px)`;
      dots.forEach(dot => dot.classList.remove("active"));
      dots[index].classList.add("active");
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % 2;
      updateSlide(currentSlide);
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + 2) % 2;
      updateSlide(currentSlide);
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide(index);
    }
  </script>
</body>
</html>
